<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QR Code Generator</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <h1>QR Code Generator</h1>

      <p>Create customized QR codes in seconds.</p>

      <form method="POST" enctype="multipart/form-data">
        <label for="url">Website URL</label>

        <input
          type="url"
          id="url"
          name="url"
          placeholder="https://example.com"
          value="{{ url }}"
          required
        />

        <div class="color-options">
          <div class="color-input">
            <label for="fill_color">QR Code Color</label>

            <input
              type="color"
              id="fill_color"
              name="fill_color"
              value="{{ fill_color }}"
            />
          </div>

          <div class="color-input">
            <label for="back_color">Background Color</label>

            <input
              type="color"
              id="back_color"
              name="back_color"
              value="{{ back_color }}"
            />
          </div>
        </div>

        <div class="logo-upload">
          <label for="logo">Add Your Logo (Optional)</label>

          <input
            type="file"
            id="logo"
            name="logo"
            accept=".png,.jpg,.jpeg,.webp"
          />

          <small>PNG, JPG or WEBP · Maximum 2 MB</small>
        </div>

        <button type="submit">Generate QR Code</button>
      </form>
    </div>
  </body>
</html>

{% if qr_image %}

<div class="result">
  <h2>Your QR Code</h2>

  <img
    src="{{ url_for('static', filename='qrcodes/' + qr_image) }}"
    alt="Generated QR Code"
  />

  <div class="download-options">
    <a
      href="{{ url_for('static', filename='qrcodes/' + qr_image) }}"
      download="qrcode.png"
    >
      Download PNG
    </a>

    <a
      href="{{ url_for('static', filename='qrcodes/' + svg_image) }}"
      download="qrcode.svg"
    >
      Download SVG
    </a>
  </div>
</div>

{% endif %}
