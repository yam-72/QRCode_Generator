<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>QR Code Generator</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <h1>QR Code Generator</h1>

      <p>Turn any website link into a QR code.</p>

      <form method="POST">
        <input
          type="url"
          name="url"
          placeholder="https://example.com"
          required
        />

        <button type="submit">Generate QR Code</button>
      </form>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %} {% if qr_image %}

      <div class="result">
        <h2>Your QR Code</h2>

        <img
          src="{{ url_for('static', filename=qr_image.replace('static/', '')) }}"
          alt="Generated QR Code"
        />

        <a
          href="{{ url_for('static', filename=qr_image.replace('static/', '')) }}"
          download="qrcode.png"
        >
          Download QR Code
        </a>
      </div>

      {% endif %}
    </div>
  </body>
</html>
